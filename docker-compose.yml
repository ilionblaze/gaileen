version: '3.8'

services:
  backend:
    build: ./backend
    container_name: gaileen-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./gaileen.py:/app/gaileen.py
      - ./cipher.py:/app/cipher.py
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gaileen-network

  frontend:
    build: ./frontend
    container_name: gaileen-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - gaileen-network

networks:
  gaileen-network:
    driver: bridge
